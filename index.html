            --border-light: #2A2A45;
            --lime: #24AFFF;
            --lime-dark: #1B8FD4;
            --blue: #24AFFF;
            --blue-light: #5CC4FF;
            --white: #FFFFFF;
            --gray-100: #E8E8F0;
            --gray-200: #BBBBD0;
            --gray-300: #8888A8;
            --gray-400: #5A5A78;
            --gray-500: #3A3A55;
            --green: #22C55E;
            --red: #EF4444;

        body {

        /* Layout */

        .section { padding: 96px 0; }
        .text-lime { color: var(--lime); }
        .text-blue { color: var(--blue); }

        /* Badge */
        .badge {

            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(36,175,255,0.08);

            font-weight: 600;

            font-family: var(--font-heading); font-weight: 700; font-size: 15px;
            padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer;
            text-decoration: none; transition: all 0.2s;

        .btn-primary:hover { background: linear-gradient(135deg, #5CC4FF 0%, #24AFFF 100%); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(36,175,255,0.25); }
        .btn-lg { padding: 16px 32px; font-size: 16px; }
        .btn-xl { padding: 20px 40px; font-size: 18px; border-radius: 10px; }
        .btn-sm { padding: 10px 20px; font-size: 13px; }
        .btn-secondary {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent; color: var(--lime);
            border: 1px solid rgba(36,175,255,0.3);
            font-family: var(--font-heading); font-weight: 600; font-size: 15px;
            padding: 14px 28px; border-radius: 8px; cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--lime); background: rgba(36,175,255,0.06); }

        /* ============ HEADER ============ */
        .site-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 16px 0; transition: all 0.3s;
        }
        .site-header.scrolled { background: rgba(7,7,16,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .header-inner { display: flex; align-items: center; justify-content: flex-end; gap: 32px; }
        .header-nav { display: flex; gap: 28px; margin-right: auto; }
        .header-nav a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--gray-200); transition: color 0.2s; }
        .header-nav a:hover { color: var(--lime); }
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 5px; padding: 4px; }
        .menu-toggle span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; }

        /* ============ HERO ============ */
        .hero-section { padding: 140px 0 80px; position: relative; overflow: hidden; }
        .hero-bg-glow {
            position: absolute; top: -200px; left: -100px; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(36,175,255,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-bg-glow-right {
            position: absolute; top: -100px; right: -150px; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(36,175,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-title { font-family: var(--font-heading); font-size: 58px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 16px; }
        .hero-sub { color: var(--gray-200); font-size: 18px; margin-top: 20px; line-height: 1.65; }
        .hero-features { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
        .hero-feat { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--gray-200); }
        .hero-feat strong { color: var(--white); }
        .hero-ctas { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; }

        /* ============ STATS BAR ============ */
        .stats-bar { padding: 0; position: relative; z-index: 2; margin-top: -20px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
            background: var(--border); border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        .stat-item { background: var(--bg-card); padding: 28px 24px; text-align: center; }
        .stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; color: var(--lime); }
        .stat-label { font-size: 13px; color: var(--gray-300); margin-top: 4px; font-weight: 500; }

        /* ============ HOW IT WORKS ============ */
        .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .step-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            padding: 32px 28px; position: relative; transition: border-color 0.3s;
        }
        .step-card:hover { border-color: rgba(36,175,255,0.3); }
        .step-icon { margin-bottom: 16px; }
        .step-num { font-family: var(--font-heading); font-size: 48px; font-weight: 700; color: rgba(36,175,255,0.1); position: absolute; top: 16px; right: 24px; }
        .step-title { font-family: var(--font-heading); font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .step-desc { font-size: 14px; color: var(--gray-300); line-height: 1.6; }

        /* ============ PERFORMANCE ============ */
        .perf-grid { display: grid; grid-template-columns: 320px 1fr; gap: 32px; align-items: start; }
        .perf-stats { display: flex; flex-direction: column; gap: 16px; }
        .perf-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .perf-stat-label { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .perf-stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; }
        .winloss-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .win-bar { background: var(--green); }
        .loss-bar { background: var(--red); }
        .perf-chart { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }

        /* Proof gallery */
        .proof-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }

        .proof-scroll::-webkit-scrollbar-track { background: var(--bg-2); border-radius: 4px; }
        .proof-scroll::-webkit-scrollbar-thumb { background: var(--gray-500); border-radius: 4px; }
        .proof-img-wrap {
            flex: 0 0 220px; scroll-snap-align: start;
            border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
            background: #000;

        .proof-img-wrap img { width: 100%; height: auto; }

        /* ============ TRADES TABLE ============ */
        .trades-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); }

        .trades-table th {

            letter-spacing: 0.06em; color: var(--gray-400); font-weight: 600;
            border-bottom: 1px solid var(--border); background: var(--bg-2);

        .trades-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(31,31,53,0.5); }
        .trades-table tbody tr:hover { background: rgba(36,175,255,0.02); }
        .trades-table tfoot td { padding: 16px; border-top: 1px solid var(--border); border-bottom: none; }
        .trade-type { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .trade-type.buy { background: rgba(36,175,255,0.12); color: var(--blue); }
        .trade-type.sell { background: rgba(239,68,68,0.12); color: var(--red); }

        /* ============ CALCULATOR ============ */
        .calc-input-area { max-width: 560px; margin: 0 auto 40px; }
        .calc-input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .calc-dollar-input {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px;
        }
        .calc-amount-input {
            background: none; border: none; outline: none; color: var(--white);
            font-family: var(--font-heading); font-size: 22px; font-weight: 700; width: 140px; text-align: right;
        }
        .calc-slider {
            -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none;
            background: linear-gradient(to right, #24AFFF 0%, #24AFFF var(--progress), #1F1F35 var(--progress), #1F1F35 100%);
        }
        .calc-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
            background: #24AFFF; cursor: pointer; border: 3px solid var(--bg-0);
            box-shadow: 0 0 12px rgba(36,175,255,0.35);
        }
        .calc-slider::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%;
            background: #24AFFF; cursor: pointer; border: 3px solid var(--bg-0);
        }
        .calc-presets { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
        .calc-preset-btn {
            padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
            background: var(--bg-card); border: 1px solid var(--border); color: var(--gray-200);
            cursor: pointer; transition: all 0.15s; font-family: var(--font-heading);
        }
        .calc-preset-btn:hover, .calc-preset-btn.active { border-color: var(--lime); color: var(--lime); background: rgba(36,175,255,0.06); }

        .milestone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .milestone-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; text-align: center;
        }
        .calc-chart-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
        .calc-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); }
        .calc-table { width: 100%; border-collapse: collapse; min-width: 360px; }
        .calc-table th {
            padding: 14px 20px; text-align: left; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--gray-400); font-weight: 600;
            border-bottom: 1px solid var(--border); background: var(--bg-2);
        }
        .calc-table td { padding: 12px 20px; font-size: 14px; border-bottom: 1px solid rgba(31,31,53,0.5); }
        .calc-table .highlight-row { background: rgba(36,175,255,0.04); }
        .calc-table .highlight-row td { border-bottom-color: rgba(36,175,255,0.1); }

        /* ============ TESTIMONIALS ============ */
        .testimonials-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .testimonial-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;

        .testimonial-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .testimonial-avatar {

            .stat-item { padding: 18px 12px; }

            /* Milestone */
            .milestone-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .milestone-card { padding: 14px 10px; }

            /* Calculator */

            .calc-dollar-input { width: 100%; box-sizing: border-box; }
            .calc-amount-input { flex: 1; width: 100%; font-size: 18px; }
            .calc-presets { gap: 6px; }

            .calc-table th, .calc-table td { padding: 10px 12px; font-size: 12px; }

            /* Trades */
            .trades-table th, .trades-table td { padding: 10px 10px; font-size: 12px; }

            /* Testimonials */
            .testimonial-card { padding: 20px; }
            .testimonial-result { gap: 10px; padding: 10px 12px; flex-wrap: wrap; justify-content: center; }
            .testimonial-stat { text-align: center; }
            .testimonial-stat-value { font-size: 17px; }

            /* Performance */
            .perf-stat-value { font-size: 22px; }

            /* Final CTA / Booking */
            .final-cta-section { padding: 60px 0; }
            .final-cta-section .section-title { font-size: 26px !important; }
            .final-cta-section .btn-xl { width: 100%; justify-content: center; }
            .calendly-inline-widget { height: 630px !important; }

            /* WhatsApp FAB */
            .whatsapp-fab { width: 52px; height: 52px; bottom: 16px; right: 16px; }
        }
        @media (max-width: 380px) {
            .hero-title { font-size: 27px; }
            .section-title { font-size: 22px; }
            .stat-value { font-size: 17px; }
            .stat-label { font-size: 10px; }
            .header-inner { gap: 12px; }
        }
    </style>
</head>

    <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

function useFadeIn() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) el.classList.add('visible'); }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function useCounter(target, dur = 1800) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const ran = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !ran.current) {
        ran.current = true;
        const t0 = performance.now();
        const tick = (now) => {
          const p = Math.min((now - t0) / dur, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          setVal(ease * target);
          if (p < 1) requestAnimationFrame(tick); else setVal(target);
        };
        requestAnimationFrame(tick);
      }
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [target, dur]);
  return [val, ref];
}

            <label style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: 15, color: 'var(--gray-200)' }}>
              Starting Deposit
            </label>
            <div className="calc-dollar-input">
              <span style={{ color: 'var(--lime)', fontWeight: 700, fontSize: 20 }}>$</span>
              <input
                type="text"
                value={inputVal}
                onChange={handleInput}
                className="calc-amount-input"
              />
            </div>
          </div>
          <div style={{ padding: '0 4px' }}>
            <input
              type="range"
              min="0"
              max="1000"
              value={slider}
              onChange={handleSlider}
              className="calc-slider"
              style={{ '--progress': progress + '%' }}
            />
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--gray-400)', marginTop: 4 }}>
              <span>$100</span>
              <span>$100,000</span>
            </div>
          </div>
          <div className="calc-presets">
            {PRESETS.map(p => (
              <button
                key={p}
                onClick={() => selectPreset(p)}
                className={`calc-preset-btn ${Math.abs(amount - p) < p * 0.05 ? 'active' : ''}`}
              >
                {p >= 1000 ? '$' + (p / 1000) + 'k' : '$' + p}
              </button>
            ))}
          </div>
        </div>

        <div className="milestone-grid">
          {milestones.map((ms, i) => (
            <div key={i} className="milestone-card">
              <div style={{ fontSize: 13, color: 'var(--gray-300)', marginBottom: 4, fontWeight: 500 }}>{ms.label}</div>
              <div style={{ fontSize: 24, fontWeight: 700, fontFamily: 'var(--font-heading)', color: 'var(--lime)' }}>{fmt(ms.val)}</div>
              <div style={{ fontSize: 12, color: 'var(--green)', marginTop: 2 }}>
                +{fmtPct(((ms.val - amount) / amount) * 100)} return
              </div>
            </div>
          ))}
        </div>

        <div className="calc-chart-wrap">
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', display: 'block' }}>
            <defs>
              <linearGradient id="calcGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="rgba(36,175,255,0.35)" />
                <stop offset="100%" stopColor="rgba(36,175,255,0)" />
              </linearGradient>
            </defs>
            {yTicks.map((t, i) => (
              <g key={i}>
                <line x1={pL} y1={t.y} x2={W - pR} y2={t.y} stroke="var(--border)" strokeWidth="0.5" />
                <text x={pL - 8} y={t.y + 4} textAnchor="end" fill="var(--gray-400)" fontSize="10" fontFamily="var(--font-body)">{t.label}</text>
              </g>
            ))}
            {xTicks.map((t, i) => (
              <text key={i} x={t.x} y={H - 8} textAnchor="middle" fill="var(--gray-400)" fontSize="10" fontFamily="var(--font-body)">{t.label}</text>
            ))}
            <path d={areaPath} fill="url(#calcGrad)" />
            <path d={linePath} fill="none" stroke="var(--lime)" strokeWidth="2.5" strokeLinejoin="round" />
            <circle cx={toX(0)} cy={toY(chartData[0])} r="4" fill="var(--white)" />
            <circle cx={toX(48)} cy={toY(chartData[48])} r="5" fill="var(--lime)" stroke="var(--bg-0)" strokeWidth="2" />
          </svg>
        </div>

        <div className="calc-table-wrap">
          <table className="calc-table">
            <thead>
              <tr>
                <th>Month</th>
                <th>Balance</th>
                <th>Total Profit</th>
                <th>Return</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => {
                const highlight = [6,12,24,48].includes(r.month);
                return (
                  <tr key={r.month} className={highlight ? 'highlight-row' : ''}>
                    <td style={{ fontWeight: highlight ? 700 : 400 }}>{r.month}</td>
                    <td style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, color: 'var(--white)' }}>{fmt(r.balance)}</td>
                    <td style={{ color: 'var(--green)', fontWeight: 600 }}>+{fmt(r.totalProfit)}</td>
                    <td style={{ color: 'var(--lime)' }}>+{fmtPct(r.returnPct)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div style={{ textAlign: 'center', marginTop: 40 }}>
          <a href="#book" className="btn-primary btn-lg">
            Book a Call — Start Compounding Now
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
          </a>
          <p style={{ marginTop: 12, fontSize: 13, color: 'var(--gray-400)' }}>
            We'll help you set up your account and connect to the strategy — completely free.
          </p>
        </div>
      </div>
    </section>
  );
}

// ================================================
function BookingSection() {
  const widgetRef = useRef(null);

  useEffect(() => {
    const CALENDLY_URL = 'https://calendly.com/bertisanoflow/copy-trading-intro?hide_event_type_details=1&hide_gdpr_banner=1';
    let attempts = 0;
    const tryInit = () => {
      if (window.Calendly && widgetRef.current) {
        window.Calendly.initInlineWidget({
          url: CALENDLY_URL,
          parentElement: widgetRef.current,
        });
      } else if (attempts < 30) {
        attempts++;
        setTimeout(tryInit, 300);
      }
    };
    tryInit();
  }, []);

  return (
    <section id="book" className="final-cta-section">
      <div className="container">
        <div style={{ textAlign: 'center', marginBottom: 40 }}>
          <span className="badge">BOOK A FREE CALL</span>
          <h2 className="section-title" style={{ fontSize: 40, maxWidth: 640, margin: '16px auto 0' }}>
            Ready to Let Your Money <span className="text-lime">Work for You</span>?
          </h2>
          <p className="section-sub" style={{ maxWidth: 540, margin: '16px auto 0' }}>
            Pick a time that suits you. We'll walk you through setup and have you earning within 24 hours. Free, no obligation.
          </p>
        </div>
        <div className="calendly-wrap">
          <div ref={widgetRef} style={{ minWidth: '320px', height: '700px' }}></div>
        </div>
      </div>
    </section>
  );
}

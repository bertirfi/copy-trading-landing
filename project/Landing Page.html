<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Income Copy Trading — Earn 18-20% Monthly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #070710;
            --bg-1: #0C0C18;
            --bg-2: #12121F;
            --bg-card: #161628;
            --border: #1F1F35;
            --border-light: #2A2A45;
            --lime: #24AFFF;
            --lime-dark: #1B8FD4;
            --blue: #24AFFF;
            --blue-light: #5CC4FF;
            --white: #FFFFFF;
            --gray-100: #E8E8F0;
            --gray-200: #BBBBD0;
            --gray-300: #8888A8;
            --gray-400: #5A5A78;
            --gray-500: #3A3A55;
            --green: #22C55E;
            --red: #EF4444;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; }

        /* Layout */
        .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
        .section { padding: 96px 0; }
        .text-lime { color: var(--lime); }
        .text-blue { color: var(--blue); }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            background: rgba(36,175,255,0.08);
            border: 1px solid rgba(36,175,255,0.18);
            color: var(--lime);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            font-family: var(--font-heading);
        }
        .section-title {
            font-family: var(--font-heading);
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }
        .section-sub { color: var(--gray-300); font-size: 17px; line-height: 1.6; }

        /* Buttons */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #24AFFF 0%, #1B8FD4 100%); color: #fff;
            font-family: var(--font-heading); font-weight: 700; font-size: 15px;
            padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #5CC4FF 0%, #24AFFF 100%); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(36,175,255,0.25); }
        .btn-lg { padding: 16px 32px; font-size: 16px; }
        .btn-xl { padding: 20px 40px; font-size: 18px; border-radius: 10px; }
        .btn-sm { padding: 10px 20px; font-size: 13px; }
        .btn-secondary {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent; color: var(--lime);
            border: 1px solid rgba(36,175,255,0.3);
            font-family: var(--font-heading); font-weight: 600; font-size: 15px;
            padding: 14px 28px; border-radius: 8px; cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--lime); background: rgba(36,175,255,0.06); }

        /* ============ HEADER ============ */
        .site-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 16px 0; transition: all 0.3s;
        }
        .site-header.scrolled { background: rgba(7,7,16,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .header-inner { display: flex; align-items: center; justify-content: flex-end; gap: 32px; }
        .header-nav { display: flex; gap: 28px; margin-right: auto; }
        .header-nav a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--gray-200); transition: color 0.2s; }
        .header-nav a:hover { color: var(--lime); }
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 5px; padding: 4px; }
        .menu-toggle span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; }

        /* ============ HERO ============ */
        .hero-section { padding: 140px 0 80px; position: relative; overflow: hidden; }
        .hero-bg-glow {
            position: absolute; top: -200px; left: -100px; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(36,175,255,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; position: relative; }
        .hero-title { font-family: var(--font-heading); font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 16px; }
        .hero-sub { color: var(--gray-200); font-size: 17px; margin-top: 20px; line-height: 1.65; max-width: 480px; }
        .hero-features { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
        .hero-feat { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--gray-200); }
        .hero-feat strong { color: var(--white); }
        .hero-ctas { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; }
        .video-wrap {
            position: relative; border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(36,175,255,0.06);
        }
        .video-wrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

        /* ============ STATS BAR ============ */
        .stats-bar { padding: 0; position: relative; z-index: 2; margin-top: -20px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
            background: var(--border); border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        .stat-item { background: var(--bg-card); padding: 28px 24px; text-align: center; }
        .stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; color: var(--lime); }
        .stat-label { font-size: 13px; color: var(--gray-300); margin-top: 4px; font-weight: 500; }

        /* ============ HOW IT WORKS ============ */
        .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .step-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            padding: 32px 28px; position: relative; transition: border-color 0.3s;
        }
        .step-card:hover { border-color: rgba(36,175,255,0.3); }
        .step-icon { margin-bottom: 16px; }
        .step-num { font-family: var(--font-heading); font-size: 48px; font-weight: 700; color: rgba(36,175,255,0.1); position: absolute; top: 16px; right: 24px; }
        .step-title { font-family: var(--font-heading); font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .step-desc { font-size: 14px; color: var(--gray-300); line-height: 1.6; }

        /* ============ PERFORMANCE ============ */
        .perf-grid { display: grid; grid-template-columns: 320px 1fr; gap: 32px; align-items: start; }
        .perf-stats { display: flex; flex-direction: column; gap: 16px; }
        .perf-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .perf-stat-label { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .perf-stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; }
        .winloss-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .win-bar { background: var(--green); }
        .loss-bar { background: var(--red); }
        .perf-chart { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
        .myfxbook-link {
            display: flex; align-items: center; gap: 8px; justify-content: center;
            padding: 14px; border-radius: 10px; background: rgba(36,175,255,0.06);
            border: 1px solid rgba(36,175,255,0.15); color: var(--blue);
            font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s;
        }
        .myfxbook-link:hover { background: rgba(36,175,255,0.12); border-color: var(--blue); }

        /* Proof gallery */
        .proof-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
        .proof-scroll::-webkit-scrollbar { height: 4px; }
        .proof-scroll::-webkit-scrollbar-track { background: var(--bg-2); border-radius: 4px; }
        .proof-scroll::-webkit-scrollbar-thumb { background: var(--gray-500); border-radius: 4px; }
        .proof-img-wrap {
            flex: 0 0 220px; scroll-snap-align: start;
            border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
            background: #000;
        }
        .proof-img-wrap img { width: 100%; height: auto; }

        /* ============ TRADES TABLE ============ */
        .trades-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); }
        .trades-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .trades-table th {
            padding: 14px 16px; text-align: left; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--gray-400); font-weight: 600;
            border-bottom: 1px solid var(--border); background: var(--bg-2);
        }
        .trades-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(31,31,53,0.5); }
        .trades-table tbody tr:hover { background: rgba(36,175,255,0.02); }
        .trades-table tfoot td { padding: 16px; border-top: 1px solid var(--border); border-bottom: none; }
        .trade-type { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .trade-type.buy { background: rgba(36,175,255,0.12); color: var(--blue); }
        .trade-type.sell { background: rgba(239,68,68,0.12); color: var(--red); }

        /* ============ CALCULATOR ============ */
        .calc-input-area { max-width: 560px; margin: 0 auto 40px; }
        .calc-input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .calc-dollar-input {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px;
        }
        .calc-amount-input {
            background: none; border: none; outline: none; color: var(--white);
            font-family: var(--font-heading); font-size: 22px; font-weight: 700; width: 140px; text-align: right;
        }
        .calc-slider {
            -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none;
            background: linear-gradient(to right, #24AFFF 0%, #24AFFF var(--progress), var(--border) var(--progress), var(--border) 100%);
        }
        .calc-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
            background: #24AFFF; cursor: pointer; border: 3px solid var(--bg-0);
            box-shadow: 0 0 12px rgba(36,175,255,0.35);
        }
        .calc-slider::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%;
            background: #24AFFF; cursor: pointer; border: 3px solid var(--bg-0);
        }
        .calc-presets { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
        .calc-preset-btn {
            padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
            background: var(--bg-card); border: 1px solid var(--border); color: var(--gray-200);
            cursor: pointer; transition: all 0.15s; font-family: var(--font-heading);
        }
        .calc-preset-btn:hover, .calc-preset-btn.active { border-color: var(--lime); color: var(--lime); background: rgba(36,175,255,0.06); }

        .milestone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .milestone-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; text-align: center;
        }
        .calc-chart-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
        .calc-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); }
        .calc-table { width: 100%; border-collapse: collapse; }
        .calc-table th {
            padding: 14px 20px; text-align: left; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--gray-400); font-weight: 600;
            border-bottom: 1px solid var(--border); background: var(--bg-2);
        }
        .calc-table td { padding: 12px 20px; font-size: 14px; border-bottom: 1px solid rgba(31,31,53,0.5); }
        .calc-table .highlight-row { background: rgba(36,175,255,0.04); }
        .calc-table .highlight-row td { border-bottom-color: rgba(36,175,255,0.1); }

        /* ============ TESTIMONIALS ============ */
        .testimonials-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .testimonial-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            padding: 28px; transition: border-color 0.3s;
        }
        .testimonial-card:hover { border-color: rgba(36,175,255,0.2); }
        .testimonial-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .testimonial-avatar {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 14px; font-family: var(--font-heading);
        }
        .testimonial-quote { font-size: 14px; color: var(--gray-200); line-height: 1.6; font-style: italic; margin-bottom: 20px; }
        .testimonial-result {
            display: flex; align-items: center; gap: 16px;
            background: var(--bg-2); border-radius: 10px; padding: 14px 18px;
        }
        .testimonial-stat { display: flex; flex-direction: column; }
        .testimonial-stat-label { font-size: 11px; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.04em; }
        .testimonial-stat-value { font-family: var(--font-heading); font-size: 20px; font-weight: 700; }

        /* ============ FINAL CTA ============ */
        .final-cta-section {
            padding: 100px 0;
            background: linear-gradient(180deg, var(--bg-0) 0%, rgba(36,175,255,0.04) 50%, var(--bg-0) 100%);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        /* ============ FOOTER ============ */
        .site-footer { padding: 40px 0; background: var(--bg-1); border-top: 1px solid var(--border); }

        /* ============ WHATSAPP FAB ============ */
        .whatsapp-fab {
            position: fixed; bottom: 28px; right: 28px; z-index: 90;
            width: 60px; height: 60px; border-radius: 50%;
            background: #25D366; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(37,211,102,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .whatsapp-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(37,211,102,0.5); }

        /* ============ ANIMATIONS ============ */
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 968px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
            .hero-title { font-size: 40px; }
            .perf-grid { grid-template-columns: 1fr; }
            .perf-chart { order: -1; }
            .steps-grid { grid-template-columns: 1fr; }
            .milestone-grid { grid-template-columns: repeat(2, 1fr); }
            .testimonials-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .section { padding: 64px 0; }
            .section-title { font-size: 30px; }
            .hero-section { padding: 110px 0 60px; }
            .hero-title { font-size: 34px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 22px; }
            .stat-item { padding: 20px 16px; }
            .milestone-grid { grid-template-columns: 1fr 1fr; }
            .milestone-card { padding: 16px; }
            .milestone-card .perf-stat-value, .milestone-card div[style*="font-size: 24"] { font-size: 18px !important; }
            .hero-ctas { flex-direction: column; }
            .header-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; background: rgba(7,7,16,0.97); padding: 20px 24px; gap: 16px; border-bottom: 1px solid var(--border); }
            .header-nav.open { display: flex; }
            .menu-toggle { display: flex; }
            .calc-presets { gap: 6px; }
            .calc-preset-btn { padding: 5px 10px; font-size: 12px; }
            .final-cta-section .section-title { font-size: 28px !important; }
            .btn-xl { padding: 16px 28px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script type="text/babel" src="page-data.jsx"></script>
    <script type="text/babel" src="page-sections.jsx"></script>
    <script type="text/babel" src="compound-calculator.jsx"></script>
    <script type="text/babel" src="page-app.jsx"></script>
</body>
</html>
